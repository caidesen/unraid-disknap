name: 测试与构建

on:
  push:
    branches: [main]
    tags: ['20*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP 测试与语法检查
        run: |
          php tests/stats.php
          php tests/database.php
          php tests/analysis.php
          php tests/alerts.php
          php tests/collect.php
          find source -name '*.php' -exec php -l {} \;
          for page in source/*.page; do php -l "$page"; done
      - name: 安装包校验与 JavaScript 检查
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --check source/analysis.js
      - uses: actions/upload-artifact@v4
        with:
          name: disknap-plugin
          path: dist/disknap.plg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: disknap-plugin
          path: dist
      - name: 校验版本与生成校验和
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          from xml.etree import ElementTree as ET
          version = ET.parse('dist/disknap.plg').getroot().get('version')
          if version != os.environ['RELEASE_TAG']:
              raise SystemExit('标签与插件版本不一致')
          PYTHON
          cd dist
          sha256sum disknap.plg > SHA256SUMS
      - name: 发布公开测试安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/disknap.plg dist/SHA256SUMS \
            --verify-tag --prerelease --title "DiskNap $RELEASE_TAG（公开测试版）" \
            --notes-file docs/发布说明.md
